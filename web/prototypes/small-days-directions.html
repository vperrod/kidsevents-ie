<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Small Days — design directions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;500;600;700&family=Fraunces:opsz,wght@9..144,500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Picker chrome is intentionally kept verbatim from the prototype skill. */
    .proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}@media(prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}.proto-picker-item:hover{color:rgba(255,255,255,.85)}.proto-picker-item:active{transform:scale(.97)}.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}.proto-picker-item[data-active]{color:#fff}.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}.proto-picker-replay{padding:0 10px;font-size:14px}
    :root{--pine:#16463a;--ink:#112f29;--lime:#c5ec70;--paper:#f6f3e9;--line:#cad6cb;--quiet:#687971;--coral:#eb775b}*{box-sizing:border-box}body{margin:0;background:#dce6dc;color:var(--ink);font:15px/1.45 "DM Sans",sans-serif}.stage{min-height:100vh}.variant{display:none;min-height:100vh}.variant.active{display:block}.button{border:0;background:var(--pine);color:#fff;min-height:44px;padding:0 16px;font-weight:700;cursor:pointer}.button.alt{background:var(--lime);color:var(--ink)}.button:active,.card button:active{transform:scale(.97)}a{color:inherit}
    /* Direction 1: Field Notes — a date-led, phone-first editorial list. */
    .field{max-width:1040px;margin:auto;background:var(--paper);min-height:100vh;padding:18px clamp(18px,4vw,58px) 110px}.field .mast{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:10px 0 20px}.field .logo{font:600 27px/1 Fraunces,serif;letter-spacing:-.06em}.field .logo i{display:inline-grid;place-items:center;width:20px;height:20px;margin-right:6px;border-radius:50%;background:var(--lime);font-style:normal;font-size:13px}.field nav{display:flex;gap:18px;color:var(--quiet);font-size:13px}.field nav b{color:var(--ink);border-bottom:2px solid var(--ink);padding-bottom:8px}.field .intro{display:grid;grid-template-columns:1fr auto;gap:22px;padding:50px 0 28px;align-items:end}.field h1{font:500 clamp(42px,7vw,79px)/.9 Fraunces,serif;letter-spacing:-.07em;max-width:650px;margin:0}.field .stamp{border-left:1px solid var(--line);padding:8px 0 8px 16px;font:11px "DM Mono",monospace;color:var(--quiet)}.field .stamp strong{display:block;font:500 26px/1 Fraunces,serif;color:var(--ink);margin-top:8px}.field .rule{border-top:2px solid var(--ink);display:flex;justify-content:space-between;padding:11px 0;color:var(--quiet);font-size:12px}.field .filters{display:flex;gap:8px;overflow:auto;padding:7px 0 19px}.field .filters button{border:1px solid var(--line);border-radius:999px;background:transparent;padding:7px 13px;white-space:nowrap;color:var(--pine);cursor:pointer}.field .filters button.active{background:var(--pine);color:white}.field .entries{border-top:1px solid var(--line)}.field .entry{display:grid;grid-template-columns:80px minmax(0,1fr) 45px;gap:17px;align-items:start;border-bottom:1px solid var(--line);padding:23px 0}.field .date{font:500 23px/1 Fraunces,serif}.field .date small{display:block;margin-top:5px;color:var(--quiet);font:11px "DM Mono",monospace}.field .entry h2{font:500 29px/.98 Fraunces,serif;letter-spacing:-.045em;margin:0 0 6px}.field .entry p{margin:0;color:var(--quiet);font-size:13px}.field .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}.field .meta span{padding:3px 7px;background:#e5eee2;border:1px solid #d0ddd0;font-size:10px;color:var(--pine)}.field .save{width:40px;height:40px;border:1px solid var(--pine);background:transparent;color:var(--pine);font-size:21px;cursor:pointer}.field .save.saved{background:var(--pine);color:white}.field .footnote{margin-top:35px;padding:19px 0;border-top:2px solid var(--pine);color:var(--quiet)}
    /* Direction 2: Local Atlas — place and region are the primary hierarchy. */
    .atlas{background:#132f2a;color:#edf2e7;min-height:100vh;padding:24px clamp(18px,5vw,75px) 110px}.atlas .top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #3c5e54;padding-bottom:18px}.atlas .logo{font:600 28px Fraunces,serif;letter-spacing:-.06em}.atlas .logo i{display:inline-block;width:21px;height:21px;margin-right:7px;border-radius:50% 50% 50% 12%;background:var(--lime);vertical-align:-2px}.atlas nav{display:flex;gap:17px;color:#aac0b5;font-size:13px}.atlas nav b{color:var(--lime)}.atlas .hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;padding:65px 0 45px}.atlas h1{font:500 clamp(45px,7vw,88px)/.86 Fraunces,serif;letter-spacing:-.075em;margin:0;max-width:680px}.atlas .hero p{max-width:420px;color:#adc4b7;font-size:16px;margin:20px 0 26px}.atlas .map{position:relative;min-height:330px;background:#1d4a3e;overflow:hidden;border:1px solid #3b675a}.atlas .map:before{content:"";position:absolute;inset:35px 70px;border:1px solid #7b9f85;border-radius:45% 55% 44% 53%;transform:rotate(17deg)}.atlas .map:after{content:"IRELAND / 32 COUNTIES";position:absolute;right:20px;bottom:18px;color:#b5cbbd;font:10px "DM Mono",monospace}.atlas .pin{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--lime);border:4px solid #1d4a3e;box-shadow:0 0 0 1px var(--lime);cursor:pointer}.atlas .pin.dublin{right:33%;top:38%}.atlas .pin.cork{left:35%;bottom:24%}.atlas .pin.galway{left:26%;top:43%}.atlas .maplabel{position:absolute;left:18px;top:18px;color:#c5ec70;font:11px "DM Mono",monospace}.atlas .strip{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #3c5e54;border-bottom:1px solid #3c5e54}.atlas .strip div{padding:16px 14px;border-right:1px solid #3c5e54}.atlas .strip div:last-child{border:0}.atlas .strip b{display:block;font:500 29px Fraunces,serif;color:var(--lime)}.atlas .strip span{color:#adc4b7;font-size:12px}.atlas .feed{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;margin-top:35px}.atlas .card{padding:21px 20px 27px;border-top:2px solid var(--lime);border-right:1px solid #3c5e54}.atlas .card:last-child{border-right:0}.atlas .card small{color:#aac0b5;font:10px "DM Mono",monospace}.atlas .card h2{font:500 29px/.98 Fraunces,serif;letter-spacing:-.045em;margin:15px 0 10px}.atlas .card p{color:#adc4b7;font-size:13px}.atlas .card button{border:0;border-bottom:1px solid var(--lime);background:none;color:var(--lime);padding:8px 0;font-weight:700;cursor:pointer}
    /* Direction 3: Day Board — a bold planning surface, not a feed or blog. */
    .board{background:#ede9df;min-height:100vh;padding:18px clamp(15px,4vw,55px) 110px;color:#182f2a}.board .top{display:flex;justify-content:space-between;align-items:center}.board .logo{font:700 27px "Space Grotesk",sans-serif;letter-spacing:-.08em}.board .logo i{display:inline-block;width:22px;height:22px;background:var(--coral);border-radius:4px 50% 50% 50%;vertical-align:-3px;margin-right:7px}.board nav{display:flex;gap:19px;font-size:13px}.board nav b{border-bottom:2px solid #182f2a;padding-bottom:9px}.board .title{display:flex;justify-content:space-between;gap:22px;align-items:end;border-bottom:3px solid #182f2a;padding:75px 0 17px}.board h1{font:700 clamp(42px,7vw,84px)/.83 "Space Grotesk",sans-serif;letter-spacing:-.1em;max-width:740px;margin:0}.board .date{font:500 13px "DM Mono",monospace;text-align:right}.board .date strong{display:block;font:700 42px/.9 "Space Grotesk",sans-serif;letter-spacing:-.09em}.board .tools{display:flex;justify-content:space-between;gap:12px;padding:13px 0}.board .tools input{min-height:39px;padding:0 11px;border:1px solid #aebbb0;background:#f8f5ec;min-width:220px}.board .tools button{border:1px solid #182f2a;background:transparent;padding:8px 12px;font-weight:700}.board .grid{display:grid;grid-template-columns:1.25fr .75fr .75fr;grid-template-rows:auto auto;gap:12px}.board .card{position:relative;min-height:230px;padding:20px;background:#fffdf6;border:1px solid #aebbb0;overflow:hidden}.board .card.feature{grid-row:span 2;background:#c5ec70;border-color:#182f2a;min-height:470px}.board .card:nth-child(3){background:#183f35;color:#fff}.board .card:nth-child(4){background:#f08a6c}.board .card small{font:500 10px "DM Mono",monospace;letter-spacing:.04em}.board .card h2{font:700 clamp(27px,3vw,44px)/.9 "Space Grotesk",sans-serif;letter-spacing:-.08em;margin:34px 0 10px;max-width:380px}.board .card:not(.feature) h2{font-size:29px;margin-top:25px}.board .card p{font-size:13px;max-width:360px}.board .card .arrow{position:absolute;right:16px;top:16px;font-size:25px}.board .card .tag{position:absolute;bottom:16px;left:20px;font:500 10px "DM Mono",monospace}.board .bottom{display:flex;justify-content:space-between;align-items:center;border-top:2px solid #182f2a;margin-top:26px;padding-top:14px;font-size:13px}.board .bottom a{font-weight:700;text-decoration:underline}
    @media(max-width:720px){.field nav,.atlas nav,.board nav{display:none}.field .intro,.atlas .hero,.board .title{display:block}.field .stamp{border-left:0;border-top:1px solid var(--line);margin-top:23px;padding:12px 0 0}.field .entry{grid-template-columns:54px 1fr 38px;gap:10px}.field .entry h2{font-size:24px}.atlas .hero{padding-top:45px}.atlas .map{margin-top:28px;min-height:270px}.atlas .strip{grid-template-columns:1fr 1fr}.atlas .strip div:nth-child(2){border-right:0}.atlas .strip div:nth-child(-n+2){border-bottom:1px solid #3c5e54}.atlas .feed{grid-template-columns:1fr}.atlas .card{border-right:0}.board .title{padding-top:55px}.board .date{text-align:left;margin-top:24px}.board .grid{grid-template-columns:1fr 1fr;grid-template-rows:auto}.board .card.feature{grid-column:span 2;grid-row:auto;min-height:360px}.board .card h2{font-size:31px}.board .tools{display:block}.board .tools input{width:100%;margin-bottom:8px}}
    @media(prefers-reduced-motion:reduce){.field .entry,.atlas .card,.board .card{transition:none!important}}
  </style>
</head>
<body>
<main id="stage"></main>
<nav class="proto-picker" aria-label="Prototype variants"><span class="proto-picker-highlight" aria-hidden="true"></span><button class="proto-picker-item" data-active aria-current="true">Field Notes</button><button class="proto-picker-item">Local Atlas</button><button class="proto-picker-item">Day Board</button><span class="proto-picker-divider" aria-hidden="true"></span><button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button></nav>
<script>
const variants=[fieldNotes,localAtlas,dayBoard];const stage=document.getElementById('stage'),picker=document.querySelector('.proto-picker'),highlight=picker.querySelector('.proto-picker-highlight'),items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')],replay=picker.querySelector('.proto-picker-replay');let current=0;
function shell(inner,cls){return`<div class="${cls} variant active">${inner}</div>`}
function fieldNotes(){return shell(`<header class="mast"><div class="logo"><i>s</i>Small Days</div><nav><b>Today</b><span>Find</span><span>Holidays</span><span>Saved</span></nav><span class="button alt">Keep a plan</span></header><section class="intro"><h1>One good thing to do in Ireland.</h1><div class="stamp">FRIDAY / 11 SEPTEMBER<strong>126<br>ideas live</strong></div></section><div class="rule"><span>CURATED FOR REAL FAMILY DAYS</span><span>DUBLIN · CORK · GALWAY +</span></div><div class="filters"><button class="active">This weekend</button><button>Free first</button><button>Outdoor</button><button>Under 6</button></div><div class="entries">${[['SAT 12','Beyond the Trees Avondale','Wicklow · forest day, treetop walk','Nature','Free elements'],['SUN 13','GoKidsGo | General Admission','County Dublin · indoor play','Indoor','Cost to check'],['THU 16','Neon Painting: Sail Away','Dublin 2 · make something together','Activity','Ages to check'],['MON 01','Artmaking for Children','Tipperary · creative workshop','Workshop','Booking advised']].map((x,i)=>`<article class="entry"><div class="date">${x[0].split(' ')[1]}<small>${x[0].split(' ')[0]}</small></div><div><h2>${x[1]}</h2><p>${x[2]}</p><div class="meta"><span>${x[3]}</span><span>${x[4]}</span></div></div><button class="save" onclick="this.classList.toggle('saved');this.textContent=this.classList.contains('saved')?'✓':'+'">+</button></article>`).join('')}</div><p class="footnote">Every listing keeps its original source link, location and planning notes. Small Days is a starting point, not an endless scroll.</p>`,'field')}
function localAtlas(){return shell(`<header class="top"><div class="logo"><i></i>Small Days</div><nav><b>Explore</b><span>Holidays</span><span>My plan</span></nav><span class="button alt">Sign in</span></header><section class="hero"><div><div style="color:var(--lime);font:11px 'DM Mono',monospace">IRELAND / PICK A PLACE</div><h1>Where could the day take you?</h1><p>Start with a region, then choose something that fits your weather, budget and people.</p><button class="button alt">Use my location</button></div><div class="map"><span class="maplabel">TAP A REGION</span><button class="pin dublin" aria-label="Dublin"></button><button class="pin cork" aria-label="Cork"></button><button class="pin galway" aria-label="Galway"></button></div></section><div class="strip"><div><b>38</b><span>Dublin ideas</span></div><div><b>24</b><span>Free to start</span></div><div><b>15</b><span>Outdoor picks</span></div><div><b>03</b><span>Holiday guides</span></div></div><div class="feed">${[['DUBLIN · INDOOR','A rainy-day room for making things','GoKidsGo · General Admission'],['WICKLOW · NATURE','Walk above the trees','Beyond the Trees Avondale'],['TIPPERARY · CREATIVE','A small workshop, a big afternoon','Artmaking for Children']].map(x=>`<article class="card"><small>${x[0]}</small><h2>${x[1]}</h2><p>${x[2]}</p><button>See the plan ↗</button></article>`).join('')}</div>`,'atlas')}
function dayBoard(){return shell(`<header class="top"><div class="logo"><i></i>Small Days</div><nav><b>Today</b><span>Find</span><span>Holidays</span><span>Saved</span></nav><span style="font-weight:700">Menu +</span></header><section class="title"><h1>Make a day of it.</h1><div class="date">TODAY<strong>11<br>SEP</strong></div></section><div class="tools"><input placeholder="Search the board" aria-label="Search the board"><div><button>Free</button><button>Nearby</button><button>Any age</button></div></div><div class="grid"><article class="card feature"><small>FEATURED / WICKLOW</small><span class="arrow">↗</span><h2>Beyond the Trees Avondale</h2><p>A forest day with a little height, a little wonder and room to make it your own.</p><span class="tag">NATURE · FREE ELEMENTS + TICKETS</span></article><article class="card"><small>DUBLIN / INDOOR</small><span class="arrow">+</span><h2>GoKidsGo</h2><p>General admission and a softer landing for rainy afternoons.</p><span class="tag">COST TO CHECK</span></article><article class="card"><small>DUBLIN 2 / ACTIVITY</small><span class="arrow">+</span><h2>Neon Painting</h2><p>Sail Away at Pawn Shop.</p><span class="tag">AGES TO CHECK</span></article><article class="card"><small>TIPPERARY / WORKSHOP</small><span class="arrow">+</span><h2>Make something</h2><p>Artmaking for Children — Creative Ireland Programme.</p><span class="tag">BOOKING ADVISED</span></article></div><footer class="bottom"><span>126 ideas, clearly sourced.</span><a>Build your small plan ↗</a></footer>`,'board')}
function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`}function wireVariant(){document.querySelectorAll('.filters button,.tools button').forEach(b=>b.addEventListener('click',()=>{b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}));document.querySelectorAll('.atlas .pin').forEach(p=>p.addEventListener('click',()=>{document.querySelectorAll('.atlas .pin').forEach(x=>x.classList.remove('selected'));p.classList.add('selected')}))}function mount(i){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=variants[i]();wireVariant()})}function setActive(i){if(i<0||i>=variants.length)return;current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current')});moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i)}items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));replay.addEventListener('click',()=>mount(current));window.addEventListener('resize',moveHighlight);document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable||e.metaKey||e.ctrlKey||e.altKey)return;const n=parseInt(e.key,10);if(n>=1&&n<=variants.length)setActive(n-1);else if(e.key==='ArrowRight')setActive((current+1)%variants.length);else if(e.key==='ArrowLeft')setActive((current+2)%variants.length);else if(e.key==='r'||e.key==='R')mount(current)});setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
</script></body></html>
