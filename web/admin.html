<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#1B5C63" />
    <title>Small Days — Editor desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="assets/small-days-mark.svg" type="image/svg+xml" />
    <style>
      :root {
        --primary: #1b5c63;
        --primary-deep: #17312d;
        --canvas: #f5f7f2;
        --surface: #ffffff;
        --ink: #17312d;
        --muted: #46615b;
        --line: #9fb2aa;
        --line-soft: #dde8d7;
        --accent: #f1c84b;
        --warn: #8c6500;
        --bad: #a23f3a;
        --r-control: 12px;
        --r-card: 20px;
        --rail-w: 236px;
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      html,
      body {
        max-width: 100%;
        overflow-x: hidden;
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font: 15px/1.55 "Atkinson Hyperlegible", Arial, sans-serif;
      }
      body.locked {
        overflow: hidden;
      }
      h1,
      h2,
      h3,
      .display {
        font-family: "Bricolage Grotesque", Arial, sans-serif;
        font-weight: 700;
        letter-spacing: -0.03em;
        margin: 0;
      }
      h1 {
        font-size: 30px;
      }
      h2 {
        font-size: 20px;
      }
      h3 {
        font-size: 16px;
      }
      p {
        margin: 0;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button[disabled] {
        cursor: not-allowed;
        opacity: 0.55;
      }
      a {
        color: var(--primary);
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
        box-shadow: 0 0 0 1px var(--primary-deep);
        border-radius: 6px;
      }
      .skip {
        position: absolute;
        left: -9999px;
        top: 0;
        background: var(--surface);
        padding: 12px 16px;
        z-index: 60;
      }
      .skip:focus {
        left: 8px;
        top: 8px;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 13px;
      }
      /* ── shell ─────────────────────────────────────────── */
      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: var(--rail-w) minmax(0, 1fr);
      }
      .rail {
        background: var(--primary-deep);
        color: #e7efe9;
        padding: 20px 14px;
        display: flex;
        flex-direction: column;
        gap: 22px;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: "Bricolage Grotesque", Arial, sans-serif;
        font-weight: 700;
        font-size: 20px;
        letter-spacing: -0.045em;
      }
      .brand img {
        width: 32px;
        height: 32px;
        display: block;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
        overflow-y: auto;
      }
      .nav a {
        display: flex;
        align-items: center;
        gap: 11px;
        min-height: 44px;
        padding: 0 12px;
        border-radius: var(--r-control);
        color: #e7efe9;
        text-decoration: none;
        font-weight: 700;
        font-size: 14.5px;
      }
      .nav a:hover {
        background: #24554e;
      }
      .nav a[aria-current="page"] {
        background: var(--accent);
        color: var(--primary-deep);
      }
      .nav svg {
        flex: none;
        width: 20px;
        height: 20px;
      }
      .nav .label {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .badge {
        flex: none;
        min-width: 24px;
        padding: 2px 7px;
        border-radius: 999px;
        background: var(--accent);
        color: var(--primary-deep);
        font-size: 12px;
        font-weight: 700;
        text-align: center;
      }
      .nav a[aria-current="page"] .badge {
        background: var(--primary-deep);
        color: var(--accent);
      }
      .badge.bad {
        background: var(--bad);
        color: #fff;
      }
      .rail-foot {
        margin-top: auto;
        font-size: 12.5px;
        color: #b9ccc4;
      }
      .rail-foot a {
        color: #dff0e6;
        display: inline-flex;
        min-height: 44px;
        align-items: center;
      }
      .topbar {
        display: none;
      }
      main {
        min-width: 0;
        padding: 28px 30px 80px;
      }
      .page-head {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        justify-content: space-between;
        flex-wrap: wrap;
        margin-bottom: 22px;
      }
      .page-head p {
        max-width: 62ch;
        color: var(--muted);
        margin-top: 6px;
      }
      /* ── controls ──────────────────────────────────────── */
      .btn {
        text-decoration: none;
        color: var(--ink);
        min-height: 44px;
        padding: 0 16px;
        border-radius: var(--r-control);
        border: 1px solid var(--line);
        background: var(--surface);
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        justify-content: center;
      }
      .btn:active:not([disabled]) {
        transform: scale(0.98);
      }
      .btn.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      .btn.accent {
        background: var(--accent);
        border-color: #d9b23c;
        color: var(--primary-deep);
      }
      .btn.danger {
        border-color: #d3a9a4;
        color: var(--bad);
      }
      .btn.small {
        min-height: 38px;
        padding: 0 12px;
        font-size: 13.5px;
      }
      input[type="text"],
      input[type="search"],
      select,
      textarea {
        min-height: 44px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: var(--r-control);
        background: var(--surface);
        max-width: 100%;
      }
      .field {
        display: inline-flex;
        flex-direction: column;
        gap: 4px;
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
      }
      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: flex-end;
        margin-bottom: 16px;
      }
      .toolbar .grow {
        flex: 1 1 220px;
      }
      .toolbar .grow input {
        width: 100%;
      }
      /* ── surfaces ──────────────────────────────────────── */
      .card {
        background: var(--surface);
        border: 1px solid rgba(70, 97, 91, 0.28);
        border-radius: var(--r-card);
        padding: 18px;
        box-shadow: 0 1px 2px rgba(23, 49, 45, 0.04), 0 6px 18px rgba(23, 49, 45, 0.04);
      }
      .grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      }
      .stat b {
        display: block;
        font-family: "Bricolage Grotesque", Arial, sans-serif;
        font-size: 34px;
        line-height: 1.1;
        color: var(--primary);
      }
      .stat .k {
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .stat .n {
        font-size: 13px;
        color: var(--muted);
        margin-top: 6px;
      }
      .section {
        margin-top: 22px;
      }
      .section > h2 {
        margin-bottom: 4px;
      }
      .section > .sub {
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 12px;
        max-width: 70ch;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--canvas);
        font-size: 12.5px;
        font-weight: 700;
        color: var(--muted);
      }
      .chip.miss {
        border-color: #dcc48c;
        background: #fdf6e3;
        color: var(--warn);
      }
      .chip.ok {
        border-color: #a9cbb2;
        background: #eef7ee;
        color: #2f6b3e;
      }
      .chip.bad {
        border-color: #d9b4b0;
        background: #fbeeed;
        color: var(--bad);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .notice {
        border: 1px dashed var(--line);
        border-radius: var(--r-control);
        padding: 12px 14px;
        color: var(--muted);
        background: #fbfcfa;
        font-size: 14px;
      }
      .notice.error {
        border-style: solid;
        border-color: #d9b4b0;
        background: #fbeeed;
        color: var(--bad);
      }
      .skeleton {
        height: 92px;
        border-radius: var(--r-card);
        background: linear-gradient(90deg, #eef2ec, #f7faf5, #eef2ec);
        border: 1px solid var(--line-soft);
      }
      /* ── tables ────────────────────────────────────────── */
      .table-wrap {
        overflow-x: auto;
        border: 1px solid rgba(70, 97, 91, 0.28);
        border-radius: var(--r-card);
        background: var(--surface);
      }
      table {
        border-collapse: collapse;
        width: 100%;
        min-width: 640px;
        font-size: 14px;
      }
      th,
      td {
        text-align: left;
        padding: 11px 12px;
        border-bottom: 1px solid var(--line-soft);
        vertical-align: top;
      }
      th {
        font-size: 12.5px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        background: #f2f6f0;
        position: sticky;
        top: 0;
      }
      tbody tr:hover {
        background: #f7faf5;
      }
      td .t {
        font-weight: 700;
      }
      .pager {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        padding: 10px 0;
        font-size: 13.5px;
        color: var(--muted);
      }
      .pager .btn {
        min-height: 40px;
      }
      /* ── queue ─────────────────────────────────────────── */
      details.group {
        margin-bottom: 14px;
        border: 1px solid rgba(70, 97, 91, 0.28);
        border-radius: var(--r-card);
        background: var(--surface);
        overflow: hidden;
      }
      details.group > summary {
        list-style: none;
        cursor: pointer;
        padding: 14px 16px;
        min-height: 44px;
        display: flex;
        gap: 10px;
        align-items: center;
        font-weight: 700;
        background: #f2f6f0;
      }
      details.group > summary::-webkit-details-marker {
        display: none;
      }
      details.group > summary .gt {
        flex: 1;
        min-width: 0;
      }
      .group-body {
        padding: 14px 16px 6px;
      }
      .qcard {
        border: 1px solid var(--line-soft);
        border-radius: var(--r-card);
        padding: 14px;
        margin-bottom: 12px;
        background: var(--surface);
      }
      .qcard:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
        box-shadow: 0 0 0 2px var(--primary);
      }
      .qcard .cap {
        margin: 8px 0;
        word-break: break-word;
      }
      .qcard .why {
        font-size: 13.5px;
        color: var(--warn);
        background: #fdf6e3;
        border: 1px solid #e6d3a2;
        border-radius: var(--r-control);
        padding: 8px 10px;
        margin: 8px 0;
      }
      .qcard .acts {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .qcard .acts .btn {
        flex: 1 1 140px;
      }
      .hint-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .hint-row input {
        flex: 1 1 220px;
      }
      .qerr {
        margin-top: 8px;
        font-size: 13.5px;
        color: var(--bad);
      }
      /* ── log ───────────────────────────────────────────── */
      .log {
        background: #10251f;
        color: #d8e6dd;
        border-radius: var(--r-card);
        padding: 14px;
        font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        max-height: 460px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .log .ln {
        display: block;
      }
      .log .ln.err {
        color: #ffb4a8;
        font-weight: 700;
      }
      .bar {
        height: 10px;
        border-radius: 999px;
        background: var(--line-soft);
        overflow: hidden;
        margin-top: 8px;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--primary);
      }
      /* ── overlays ──────────────────────────────────────── */
      [hidden] {
        display: none !important;
      }
      .scrim {
        position: fixed;
        inset: 0;
        background: rgba(23, 49, 45, 0.44);
        z-index: 40;
        display: flex;
      }
      .drawer {
        margin-left: auto;
        width: min(520px, 100%);
        background: var(--surface);
        height: 100%;
        overflow: auto;
        padding: 20px 20px calc(28px + env(safe-area-inset-bottom));
        animation: slideIn 0.24s cubic-bezier(0.23, 1, 0.32, 1);
      }
      .sheet {
        margin-top: auto;
        width: 100%;
        background: var(--surface);
        border-radius: var(--r-card) var(--r-card) 0 0;
        padding: 14px 14px calc(18px + env(safe-area-inset-bottom));
        max-height: 86vh;
        overflow: auto;
        animation: sheetIn 0.24s cubic-bezier(0.23, 1, 0.32, 1);
      }
      .modal {
        margin: auto;
        width: min(420px, calc(100% - 28px));
        background: var(--surface);
        border-radius: var(--r-card);
        padding: 20px;
        animation: sheetIn 0.2s cubic-bezier(0.23, 1, 0.32, 1);
      }
      @keyframes slideIn {
        from {
          transform: translateX(18px);
          opacity: 0;
        }
      }
      @keyframes sheetIn {
        from {
          transform: scale(0.97);
          opacity: 0;
        }
      }
      .ov-head {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .kv {
        width: 100%;
        min-width: 0;
        font-size: 14px;
      }
      .kv th {
        width: 38%;
        position: static;
        background: transparent;
        text-transform: none;
        letter-spacing: 0;
        font-weight: 700;
        color: var(--muted);
      }
      .kv td {
        word-break: break-word;
      }
      .sheet .nav {
        gap: 4px;
      }
      .sheet .nav a {
        color: var(--ink);
        border: 1px solid var(--line-soft);
      }
      .sheet .nav a[aria-current="page"] {
        background: var(--accent);
        border-color: #d9b23c;
      }
      .sheet .nav a:hover {
        background: var(--canvas);
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(18px + env(safe-area-inset-bottom));
        transform: translate(-50%, 20px);
        background: var(--primary-deep);
        color: #f2f8f3;
        border-radius: var(--r-control);
        padding: 12px 14px;
        display: flex;
        gap: 12px;
        align-items: center;
        z-index: 50;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s cubic-bezier(0.23, 1, 0.32, 1), transform 0.2s cubic-bezier(0.23, 1, 0.32, 1);
        max-width: min(520px, calc(100% - 24px));
        font-size: 14px;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
        pointer-events: auto;
      }
      .toast button {
        background: var(--accent);
        color: var(--primary-deep);
        border: 0;
        border-radius: 999px;
        min-height: 36px;
        padding: 0 14px;
        font-weight: 700;
        flex: none;
      }
      .view {
        display: none;
      }
      .view.active {
        display: block;
      }
      /* ── responsive ────────────────────────────────────── */
      @media (max-width: 1060px) {
        :root {
          --rail-w: 76px;
        }
        .rail {
          padding: 18px 10px;
          align-items: center;
        }
        .nav {
          width: 100%;
        }
        .nav a {
          justify-content: center;
          padding: 0 6px;
          position: relative;
        }
        .nav .label,
        .brand span,
        .rail-foot {
          display: none;
        }
        .badge {
          position: absolute;
          top: 2px;
          right: 2px;
          min-width: 20px;
          padding: 0 5px;
          font-size: 11px;
          line-height: 18px;
        }
        main {
          padding: 24px 20px 80px;
        }
      }
      @media (max-width: 760px) {
        .shell {
          grid-template-columns: minmax(0, 1fr);
        }
        .rail {
          display: none;
        }
        .topbar {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: calc(8px + env(safe-area-inset-top)) 14px 8px;
          background: var(--primary-deep);
          color: #e7efe9;
          position: sticky;
          top: 0;
          z-index: 30;
        }
        .topbar .brand {
          font-size: 18px;
          gap: 8px;
        }
        .topbar .where {
          flex: 1;
          min-width: 0;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          font-size: 13px;
          color: #bdd2c9;
          text-align: right;
        }
        main {
          padding: 18px 14px calc(60px + env(safe-area-inset-bottom));
        }
        h1 {
          font-size: 24px;
        }
        .stat b {
          font-size: 28px;
        }
        .drawer {
          width: 100%;
          border-radius: 0;
        }
        /* The queue is the one screen that has to fit a decision on a phone:
           a card's Resubmit/Reject must be reachable without hunting. */
        .page-head {
          margin-bottom: 14px;
          align-items: center;
        }
        #page-sub {
          font-size: 13.5px;
          display: -webkit-box;
          -webkit-line-clamp: 2;
          -webkit-box-orient: vertical;
          overflow: hidden;
        }
        .toolbar {
          gap: 8px;
          margin-bottom: 10px;
        }
        .keys-hint {
          display: none;
        }
        .pager label.field {
          display: none;
        }
        details.group > summary {
          padding: 10px 12px;
        }
        .group-body {
          padding: 10px 12px 4px;
        }
        .qcard {
          padding: 12px;
        }
        .qcard .cap {
          margin: 6px 0;
          display: -webkit-box;
          -webkit-line-clamp: 3;
          -webkit-box-orient: vertical;
          overflow: hidden;
        }
        .qcard .why {
          margin: 6px 0;
          padding: 7px 9px;
          font-size: 13px;
          display: -webkit-box;
          -webkit-line-clamp: 3;
          -webkit-box-orient: vertical;
          overflow: hidden;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="shell">
      <nav class="rail" aria-label="Admin areas">
        <div class="brand">
          <img src="assets/small-days-mark.svg" alt="" /><span>Small Days</span>
        </div>
        <div class="nav" id="rail-nav"></div>
        <div class="rail-foot">
          <a href="/" target="_blank" rel="noopener">Open the public site</a>
          <p id="rail-stamp">Loading…</p>
        </div>
      </nav>
      <div class="topbar">
        <div class="brand"><img src="assets/small-days-mark.svg" alt="" /></div>
        <button class="btn small accent" id="areas-btn" aria-haspopup="dialog">Areas</button>
        <span class="where" id="topbar-where"></span>
      </div>
      <main id="main">
        <div class="page-head">
          <div>
            <h1 id="page-title">Overview</h1>
            <p id="page-sub"></p>
          </div>
          <button class="btn small" id="refresh">Refresh data</button>
        </div>
        <section class="view" id="view-overview" aria-labelledby="page-title"></section>
        <section class="view" id="view-catalogue" aria-labelledby="page-title"></section>
        <section class="view" id="view-needs-input" aria-labelledby="page-title"></section>
        <section class="view" id="view-sources" aria-labelledby="page-title"></section>
        <section class="view" id="view-production" aria-labelledby="page-title"></section>
        <section class="view" id="view-photos" aria-labelledby="page-title"></section>
        <section class="view" id="view-metrics" aria-labelledby="page-title"></section>
        <section class="view" id="view-settings" aria-labelledby="page-title"></section>
      </main>
    </div>

    <div class="scrim" id="sheet-scrim" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-label="Admin areas">
        <div class="ov-head">
          <h2>Areas</h2>
          <button class="btn small" data-close-overlay>Close</button>
        </div>
        <div class="nav" id="sheet-nav"></div>
      </div>
    </div>

    <div class="scrim" id="drawer-scrim" hidden>
      <div class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
        <div class="ov-head">
          <h2 id="drawer-title">Record</h2>
          <button class="btn small" data-close-overlay>Close</button>
        </div>
        <div id="drawer-body"></div>
      </div>
    </div>

    <div class="scrim" id="confirm-scrim" hidden>
      <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
        <h2 id="confirm-title">Are you sure?</h2>
        <p class="muted" id="confirm-body" style="margin: 8px 0 16px"></p>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <button class="btn" id="confirm-no" style="flex: 1 1 120px">Cancel</button>
          <button class="btn primary" id="confirm-yes" style="flex: 1 1 120px">Confirm</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      (() => {
        "use strict";
        const $ = (s, r) => (r || document).querySelector(s);
        const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

        /* ───────────── data adapter ─────────────
           Every network read/write in this page goes through Api. Phase 1 adds
           /api/v1/*, a staged needs_input feed and a missing_field on staged
           records: swap the paths here and the views keep working. */
        const ROOT = (location.pathname.match(/^(.*)\/admin/) || ["", ""])[1] || "";
        async function req(path, opts) {
          const res = await fetch(ROOT + path, opts);
          let body = null;
          try {
            body = await res.json();
          } catch (e) {
            body = null;
          }
          if (!res.ok) {
            const err = new Error((body && (body.message || body.error)) || "HTTP " + res.status);
            err.status = res.status;
            err.body = body;
            throw err;
          }
          return body;
        }
        const post = (path, body) =>
          req(path, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body || {}),
          });
        const Api = {
          status: () => req("/admin/api/status"),
          metrics: () => req("/admin/api/metrics"),
          stats: () => req("/admin/api/stats"),
          sources: () => req("/admin/api/sources").then((d) => (d && d.sources) || []),
          pipeline: () => req("/admin/api/pipeline"),
          logs: () => req("/admin/api/logs").then((d) => (d && d.lines) || []),
          events: () => req("/admin/api/events").then((d) => (d && d.events) || []),
          places: () => req("/api/places"),
          holidays: () => req("/api/holidays"),
          staged: () => req("/admin/api/social/staged"),
          claims: () => req("/admin/api/claims").then((d) => (d && d.claims) || []),
          runPipeline: () => post("/admin/api/pipeline/run", {}),
          approve: (source_url, hint) => post("/admin/api/social/approve", { source_url, hint }),
          reject: (source_url, note) => post("/admin/api/social/reject", { source_url, note }),
          // Full contract records the gate could not publish -- a different
          // file and shape from the social candidates above (their
          // `missing_field` names one structured field, not a free-text hint).
          catalogueNeedsInput: () => req("/admin/api/needs_input"),
          resubmitCatalogueRecord: (id, patch) =>
            post("/admin/api/needs_input/resubmit", { id, patch }),
          rejectCatalogueRecord: (id) => post("/admin/api/needs_input/reject", { id }),
          // Not served by today's API. Phase 1 fills these in; until then the
          // views render an explicit "not available yet" state instead.
          needsInputFeed: null,
          decisionHistory: null,
          llmLanes: (status, pipeline) =>
            (status && status.llm) || (pipeline && pipeline.llm) || null,
        };

        /* ───────────── helpers ───────────── */
        // Upstream text arrives already HTML-escaped, so decode once before
        // escaping for output — otherwise titles render a literal &#039;.
        const clean = (v) =>
          String(v == null ? "" : v)
            .replace(/&amp;/g, "&")
            .replace(/&#0?39;/g, "'")
            .replace(/&#8217;/g, "’")
            .replace(/&#8211;/g, "–")
            .replace(/&quot;/g, '"')
            .replace(/&lt;/g, "<")
            .replace(/&gt;/g, ">");
        const esc = (v) =>
          clean(v).replace(
            /[&<>"']/g,
            (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[c],
          );
        const DASH = "—";
        const txt = (v) => {
          if (v == null) return DASH;
          if (typeof v === "number") return Number.isFinite(v) ? String(v) : DASH;
          if (typeof v === "boolean") return v ? "Yes" : "No";
          if (Array.isArray(v)) return v.length ? v.map((x) => txt(x)).join(", ") : DASH;
          if (typeof v === "object") return JSON.stringify(v);
          const s = clean(v).trim();
          return s ? s : DASH;
        };
        const num = (v) => (typeof v === "number" && Number.isFinite(v) ? v : 0);
        const MONTHS = "Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec".split(" ");
        const pad = (n) => String(n).padStart(2, "0");
        // One time zone on this desk: UTC.
        const stamp = (v) => {
          if (!v) return "Not recorded";
          const raw = String(v);
          const iso = /\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(raw) ? raw.replace(" ", "T") + "Z" : raw;
          const d = new Date(iso);
          if (Number.isNaN(d.valueOf())) return raw;
          return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}, ${pad(d.getUTCHours())}:${pad(
            d.getUTCMinutes(),
          )} UTC`;
        };
        const ago = (v) => {
          if (!v) return "never";
          const raw = String(v);
          const iso = /\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(raw) ? raw.replace(" ", "T") + "Z" : raw;
          const d = new Date(iso);
          if (Number.isNaN(d.valueOf())) return "unknown";
          const h = Math.floor((Date.now() - d.valueOf()) / 36e5);
          return h < 1 ? "less than an hour ago" : h < 24 ? h + "h ago" : Math.floor(h / 24) + "d ago";
        };
        const pct = (a, b) => (b > 0 ? Math.round((a / b) * 100) : 0);
        const PAGE_SIZES = [25, 50, 100];
        const pageCount = (total, size) => Math.max(1, Math.ceil(total / size));
        function pager(id, page, total, size) {
          const last = pageCount(total, size);
          return `<div class="pager" data-pager="${id}">
            <button class="btn small" data-step="-1"${page <= 1 ? " disabled" : ""}>&lsaquo; Prev</button>
            <span>Page ${page} of ${last} &middot; ${total} item${total === 1 ? "" : "s"}</span>
            <button class="btn small" data-step="1"${page >= last ? " disabled" : ""}>Next &rsaquo;</button>
            <label class="field" style="flex-direction:row;align-items:center;gap:6px">Show
              <select data-size>${PAGE_SIZES.map(
                (n) => `<option value="${n}"${n === size ? " selected" : ""}>${n}</option>`,
              ).join("")}</select>
            </label>
          </div>`;
        }
        const NOT_YET = (what, when) =>
          `<p class="notice">${esc(what)} is not available yet${when ? ` ${esc(when)}` : ""}.</p>`;

        function toast(message, undoLabel, onUndo) {
          const el = $("#toast");
          el.innerHTML = `<span>${esc(message)}</span>`;
          if (undoLabel) {
            const b = document.createElement("button");
            b.type = "button";
            b.textContent = undoLabel;
            b.onclick = () => {
              el.classList.remove("show");
              onUndo();
            };
            el.appendChild(b);
          }
          el.classList.add("show");
          clearTimeout(toast._t);
          toast._t = setTimeout(() => el.classList.remove("show"), undoLabel ? 9000 : 3500);
        }

        /* ───────────── overlays (back button closes one) ───────────── */
        let closer = null;
        function openOverlay(el, onClose) {
          if (closer) closer();
          el.hidden = false;
          document.body.classList.add("locked");
          closer = () => {
            el.hidden = true;
            document.body.classList.remove("locked");
            closer = null;
            if (onClose) onClose();
          };
          history.pushState({ overlay: Date.now() }, "");
          const focusable = el.querySelector("button, a, input, select");
          if (focusable) focusable.focus();
        }
        const closeOverlay = () => {
          if (closer) history.back();
        };
        $$("[data-close-overlay]").forEach((b) => (b.onclick = closeOverlay));
        $$(".scrim").forEach(
          (s) => (s.onclick = (e) => (e.target === s && s.id !== "confirm-scrim" ? closeOverlay() : null)),
        );

        let confirmResolve = null;
        function askConfirm(title, body, confirmLabel) {
          const scrim = $("#confirm-scrim");
          $("#confirm-title").textContent = title;
          $("#confirm-body").textContent = body;
          $("#confirm-yes").textContent = confirmLabel || "Confirm";
          scrim.hidden = false;
          $("#confirm-yes").focus();
          return new Promise((resolve) => {
            confirmResolve = (v) => {
              scrim.hidden = true;
              confirmResolve = null;
              resolve(v);
            };
          });
        }
        $("#confirm-yes").onclick = () => confirmResolve && confirmResolve(true);
        $("#confirm-no").onclick = () => confirmResolve && confirmResolve(false);
        addEventListener("keydown", (e) => {
          if (e.key !== "Escape") return;
          if (confirmResolve) confirmResolve(false);
          else if (closer) closeOverlay();
        });
        addEventListener("popstate", () => {
          if (closer) closer();
        });

        /* ───────────── areas + routing ───────────── */
        const ICONS = {
          overview: "M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z",
          catalogue: "M4 5h16M4 5v14M20 5v14M4 19h16M9 5v14M14 5v14",
          "needs-input": "M3 12h5l2 3h4l2-3h5M5 5h14l2 7v7H3v-7z",
          sources: "M12 3a9 9 0 100 18 9 9 0 000-18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18",
          production: "M3 17l5-6 4 4 5-7 4 5M3 21h18",
          photos: "M3 6h18v13H3zM3 15l5-5 4 4 3-3 6 6M8.5 9.5h.01",
          metrics: "M5 20V9M12 20V4M19 20v-7M3 20h18",
          settings: "M5 7h14M5 12h14M5 17h14M9 5v4M16 10v4M11 15v4",
        };
        const AREAS = {
          overview: {
            label: "Overview",
            title: "Overview",
            sub: "One screen: what is on air, what moved today, what needs a decision, and when the collection last ran.",
          },
          catalogue: {
            label: "Catalogue",
            title: "Catalogue",
            sub: "Everything parents can see, with a completeness read on every row. Open a row for its full record.",
          },
          "needs-input": {
            label: "Needs input",
            title: "Needs input",
            sub: "The only review queue, grouped by why the automatic gate could not publish the post.",
          },
          sources: {
            label: "Sources",
            title: "Sources & discovery",
            sub: "The lanes that feed the catalogue, and the one control that starts a collection run.",
          },
          production: {
            label: "Production",
            title: "Production",
            sub: "Collection runs, the run log, and the model lanes behind them.",
          },
          photos: {
            label: "Photos",
            title: "Photos",
            sub: "Image coverage per catalogue, computed from the records themselves.",
          },
          metrics: {
            label: "Metrics",
            title: "Metrics",
            sub: "Content numbers from the API. Visitors and search are not wired up yet.",
          },
          settings: {
            label: "Settings",
            title: "Settings",
            sub: "Read-only for now: what the running system reports about itself.",
          },
        };
        const CATALOGUES = { events: "Events", places: "Things to do", holidays: "Holidays" };

        function parseHash() {
          const raw = location.hash.replace(/^#/, "");
          const cut = raw.indexOf("/");
          const area = cut < 0 ? raw : raw.slice(0, cut);
          let param = "";
          try {
            param = cut < 0 ? "" : decodeURIComponent(raw.slice(cut + 1));
          } catch (e) {
            param = "";
          }
          return { area: AREAS[area] ? area : "overview", param };
        }
        function href(area, param) {
          return "#" + area + (param ? "/" + encodeURIComponent(param) : "");
        }
        function navHtml() {
          return Object.keys(AREAS)
            .map(
              (k) =>
                `<a href="${href(k, k === "catalogue" ? S.catalogue : "")}" data-area="${k}">
                   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[k]}"/></svg>
                   <span class="label">${esc(AREAS[k].label)}</span>
                   <span class="badge" data-badge="${k}" hidden></span>
                 </a>`,
            )
            .join("");
        }

        /* ───────────── state ───────────── */
        const S = {
          area: "overview",
          catalogue: "events",
          cat: { page: 1, size: 25, q: "", county: "all", status: "all", selected: new Set() },
          queue: { view: "queue", groupPage: {}, size: 25, open: null, acted: [], restored: new Set() },
          catQueue: { page: 1, size: 25 },
          log: { q: "" },
          photos: { page: 1, size: 25 },
          claims: { page: 1, size: 25 },
        };
        const store = {};
        const RESOURCES = {
          status: Api.status,
          metrics: Api.metrics,
          stats: Api.stats,
          sources: Api.sources,
          pipeline: Api.pipeline,
          logs: Api.logs,
          events: Api.events,
          places: Api.places,
          holidays: Api.holidays,
          staged: Api.staged,
          claims: Api.claims,
          catalogueNeedsInput: Api.catalogueNeedsInput,
        };
        const ok = (k) => store[k] && store[k].ok;
        const val = (k, fallback) => (ok(k) ? store[k].data : fallback);
        const failed = (k, what) =>
          `<p class="notice error">Could not load ${esc(what)}: ${esc(
            (store[k] && store[k].error) || "unknown error",
          )}. Use “Refresh data” to try again.</p>`;

        async function loadAll() {
          await Promise.all(
            Object.keys(RESOURCES).map(async (k) => {
              try {
                store[k] = { ok: true, data: await RESOURCES[k]() };
              } catch (e) {
                store[k] = { ok: false, error: String((e && e.message) || e) };
              }
            }),
          );
        }

        /* ───────────── completeness model ───────────── */
        const PHOTO_KEYS = ["image", "image_url", "photo", "photo_url", "images", "hero_image", "thumbnail"];
        const hasPhoto = (r) =>
          PHOTO_KEYS.some((k) => {
            const v = r[k];
            return Array.isArray(v) ? v.length > 0 : !!(v && String(v).trim());
          });
        const filled = (v) => (Array.isArray(v) ? v.length > 0 : v != null && String(v).trim() !== "");
        const FIELDS = {
          events: [
            ["date", (r) => filled(r.start_date)],
            ["price", (r) => filled(r.cost) || filled(r.price_range)],
            ["age", (r) => filled(r.age_group)],
            ["category", (r) => filled(r.category)],
            ["photo", hasPhoto],
            ["maps", (r) => filled(r.latitude) && filled(r.longitude)],
          ],
          places: [
            ["price", (r) => filled(r.price_range) || filled(r.cost)],
            ["age", (r) => filled(r.age_group)],
            ["category", (r) => filled(r.category)],
            ["photo", hasPhoto],
            ["maps", (r) => filled(r.latitude) && filled(r.longitude)],
          ],
          holidays: [
            ["price", (r) => filled(r.price_range) || filled(r.cost)],
            ["age", (r) => filled(r.age_group)],
            ["category", (r) => filled(r.category)],
            ["photo", hasPhoto],
            ["maps", (r) => filled(r.latitude) && filled(r.longitude)],
          ],
        };
        const missingOf = (rec, cat) =>
          (FIELDS[cat] || []).filter(([, test]) => !test(rec)).map(([name]) => name);
        const recTitle = (r) => clean(r.title || r.name || r.venue_name || "Untitled record");
        const recCounty = (r) => clean(r.county || r.city || r.region || "");
        const catRecords = (cat) =>
          cat === "events" ? val("events", []) : cat === "places" ? val("places", []) : val("holidays", []);
        const catKey = (cat) => (cat === "events" ? "events" : cat === "places" ? "places" : "holidays");

        /* ───────────── views ───────────── */
        function renderOverview() {
          const el = $("#view-overview");
          if (!ok("metrics") && !ok("status")) {
            el.innerHTML = failed("metrics", "the overview numbers");
            return;
          }
          const m = val("metrics", {});
          const totals = (m && m.totals) || {};
          const today = (m && m.today) || {};
          const hour = (m && m.hour) || {};
          const st = val("status", {});
          const pl = val("pipeline", {});
          const history = (pl && pl.history) || [];
          const last = history.length ? history[history.length - 1] : null;
          const sources = val("sources", []);
          const byType = (val("stats", {}) || {}).sources_by_type || {};
          const needs = num(totals.needs_review);

          const stat = (k, v, note) =>
            `<div class="card stat"><span class="k">${esc(k)}</span><b>${esc(String(v))}</b><span class="n">${note}</span></div>`;

          el.innerHTML = `
            <div class="grid">
              ${stat("Events on air", num(totals.events), "Dated things happening")}
              ${stat("Things to do on air", num(totals.places), "Evergreen places")}
              ${stat("Holidays on air", num(totals.holidays), num(totals.holidays) ? "Curated day trips" : "Nothing curated yet")}
              ${stat(
                "Needs input",
                needs,
                `<a href="${href("needs-input")}">Open the queue</a>`,
              )}
            </div>
            <div class="section">
              <h2>Today, in UTC</h2>
              <p class="sub">Straight from <code>/admin/api/metrics</code>: decisions taken, not traffic.</p>
              <div class="grid">
                ${stat("Approved today", num(today.approved), "Published to the catalogue")}
                ${stat("Rejected today", num(today.rejected), "Sent back, kept as an audit trail")}
                ${stat("Approved this hour", num(hour.approved), "Since the top of the hour")}
                <div class="card"><span class="k">Counted at</span><p style="margin-top:8px"><b>${esc(
                  stamp(m && m.generated_at),
                )}</b></p><p class="n">Every time on this desk is UTC.</p></div>
              </div>
            </div>
            <div class="section">
              <h2>Collection</h2>
              <div class="grid">
                <div class="card">
                  <span class="k small muted"><b>LAST RUN</b></span>
                  <p style="margin-top:6px"><b>${esc(stamp(st.last_run || (pl && pl.last_run)))}</b></p>
                  <p class="small muted">${esc(ago(st.last_run || (pl && pl.last_run)))}${
                    st.last_run_result ? " &middot; " + esc(st.last_run_result) : ""
                  }</p>
                  ${
                    last
                      ? `<p class="small muted">Last recorded run: ${esc(txt(last.events_count))} events in ${esc(
                          txt(last.duration),
                        )} &middot; ${last.success ? "succeeded" : "failed"}</p>`
                      : ""
                  }
                </div>
                <div class="card">
                  <span class="k small muted"><b>NEXT RUN</b></span>
                  <p class="notice" style="margin-top:6px">A next-run time is not exposed by the API yet. The systemd timer reports itself as <b>${esc(
                    txt(st.factory_timer),
                  )}</b>.</p>
                </div>
                <div class="card">
                  <span class="k small muted"><b>RUNNING NOW</b></span>
                  <p style="margin-top:6px"><b>${st.factory_running ? "Yes — a run is in flight" : "No"}</b></p>
                  <p class="small muted">Factory service active: ${esc(txt(st.factory_service_active))}</p>
                </div>
              </div>
            </div>
            <div class="section">
              <h2>Source health</h2>
              <p class="sub">${sources.length} source${sources.length === 1 ? "" : "s"} configured across ${
                new Set(sources.map((s) => s.city || "unknown")).size
              } cities. Counts below are events currently on air per source (from <code>/admin/api/stats</code>) — a per-cycle breakdown is not in the API yet.</p>
              <div class="chips">
                ${
                  Object.keys(byType).length
                    ? Object.keys(byType)
                        .sort((a, b) => byType[b] - byType[a])
                        .map((k) => `<span class="chip">${esc(k)} &middot; ${num(byType[k])}</span>`)
                        .join("")
                    : `<span class="chip">no run data yet</span>`
                }
              </div>
              <p class="notice" style="margin-top:12px">No 7-day history is exposed by the API, so no sparkline is drawn here. It arrives with the phase 1 metrics feed.</p>
            </div>`;
        }

        function renderCatalogue() {
          const el = $("#view-catalogue");
          const cat = S.catalogue;
          const key = catKey(cat);
          if (!ok(key)) {
            el.innerHTML = failed(key, CATALOGUES[cat]);
            return;
          }
          const all = catRecords(cat);
          const counties = Array.from(new Set(all.map(recCounty).filter(Boolean))).sort();
          const q = S.cat.q.toLowerCase();
          let rows = all.filter((r) => {
            if (S.cat.county !== "all" && recCounty(r) !== S.cat.county) return false;
            if (S.cat.status !== "all") {
              const miss = missingOf(r, cat);
              if (S.cat.status === "complete" && miss.length) return false;
              if (S.cat.status === "incomplete" && !miss.length) return false;
              if (cat === "events") {
                const d = r.start_date ? new Date(r.start_date) : null;
                const okDate = d && !Number.isNaN(d.valueOf());
                if (S.cat.status === "undated" && okDate) return false;
                if (S.cat.status === "upcoming" && !(okDate && d.valueOf() >= Date.now())) return false;
                if (S.cat.status === "past" && !(okDate && d.valueOf() < Date.now())) return false;
              }
            }
            if (!q) return true;
            return [recTitle(r), recCounty(r), r.description, r.venue_name, r.location, r.category]
              .map((v) => clean(v).toLowerCase())
              .join(" ")
              .includes(q);
          });
          const total = rows.length;
          const last = pageCount(total, S.cat.size);
          if (S.cat.page > last) S.cat.page = last;
          const start = (S.cat.page - 1) * S.cat.size;
          const page = rows.slice(start, start + S.cat.size);
          const statusOptions =
            cat === "events"
              ? [
                  ["all", "All"],
                  ["upcoming", "Upcoming"],
                  ["past", "Past"],
                  ["undated", "No date"],
                  ["complete", "Complete"],
                  ["incomplete", "Incomplete"],
                ]
              : [
                  ["all", "All"],
                  ["complete", "Complete"],
                  ["incomplete", "Incomplete"],
                ];

          el.innerHTML = `
            <div class="chips" role="tablist" aria-label="Catalogues" style="margin-bottom:14px">
              ${Object.keys(CATALOGUES)
                .map(
                  (k) =>
                    `<a class="btn small${k === cat ? " accent" : ""}" role="tab" aria-selected="${
                      k === cat
                    }" href="${href("catalogue", k)}">${esc(CATALOGUES[k])} &middot; ${
                      ok(catKey(k)) ? catRecords(k).length : "?"
                    }</a>`,
                )
                .join("")}
            </div>
            <div class="toolbar">
              <label class="field grow">Search<input type="search" id="cat-q" value="${esc(
                S.cat.q,
              )}" placeholder="Title, venue, county, description" /></label>
              <label class="field">County<select id="cat-county"><option value="all">All counties</option>${counties
                .map(
                  (c) => `<option value="${esc(c)}"${c === S.cat.county ? " selected" : ""}>${esc(c)}</option>`,
                )
                .join("")}</select></label>
              <label class="field">Status<select id="cat-status">${statusOptions
                .map(
                  ([v, l]) => `<option value="${v}"${v === S.cat.status ? " selected" : ""}>${esc(l)}</option>`,
                )
                .join("")}</select></label>
              <button class="btn small" id="cat-bulk" disabled title="No bulk endpoint exists yet">Bulk actions (coming with phase 1)</button>
            </div>
            ${
              all.length === 0
                ? `<p class="notice">Nothing in ${esc(
                    CATALOGUES[cat],
                  )} yet. Approve a candidate in Needs input, or run a collection from Sources, and rows will appear here.</p>`
                : total === 0
                  ? `<p class="notice">No ${esc(
                      CATALOGUES[cat],
                    )} match this search and these filters. Clear the search box or set the filters back to “All”.</p>`
                  : `${pager("cat", S.cat.page, total, S.cat.size)}
                     <div class="table-wrap"><table>
                       <thead><tr>
                         <th style="width:34px"><input type="checkbox" id="cat-all" aria-label="Select every row on this page" /></th>
                         <th>Title</th><th>${cat === "events" ? "Starts (UTC)" : "Where"}</th><th>County</th><th>Completeness</th><th></th>
                       </tr></thead>
                       <tbody>${page
                         .map((r, i) => {
                           const idx = start + i;
                           const miss = missingOf(r, cat);
                           return `<tr>
                             <td><input type="checkbox" data-row="${idx}" aria-label="Select ${esc(
                               recTitle(r),
                             )}"${S.cat.selected.has(idx) ? " checked" : ""} /></td>
                             <td><span class="t">${esc(recTitle(r))}</span><br /><span class="small muted">${esc(
                               (clean(r.description) || "").slice(0, 90),
                             )}</span></td>
                             <td>${esc(
                               cat === "events" ? stamp(r.start_date) : txt(r.location || r.venue_name),
                             )}</td>
                             <td>${esc(recCounty(r) || DASH)}</td>
                             <td><div class="chips">${
                               miss.length
                                 ? miss.map((m) => `<span class="chip miss">no ${esc(m)}</span>`).join("")
                                 : `<span class="chip ok">complete</span>`
                             }</div></td>
                             <td><button class="btn small" data-open="${idx}">Open</button></td>
                           </tr>`;
                         })
                         .join("")}</tbody>
                     </table></div>
                     ${pager("cat", S.cat.page, total, S.cat.size)}`
            }`;

          const qBox = $("#cat-q");
          if (qBox)
            qBox.oninput = () => {
              S.cat.q = qBox.value;
              S.cat.page = 1;
              const pos = qBox.selectionStart;
              renderCatalogue();
              const nb = $("#cat-q");
              nb.focus();
              nb.setSelectionRange(pos, pos);
            };
          const cSel = $("#cat-county");
          if (cSel)
            cSel.onchange = () => {
              S.cat.county = cSel.value;
              S.cat.page = 1;
              renderCatalogue();
            };
          const sSel = $("#cat-status");
          if (sSel)
            sSel.onchange = () => {
              S.cat.status = sSel.value;
              S.cat.page = 1;
              renderCatalogue();
            };
          wirePager(el, "cat", S.cat, total, renderCatalogue);
          $$("[data-open]", el).forEach(
            (b) => (b.onclick = () => openRecord(rows[Number(b.dataset.open)], cat)),
          );
          $$("[data-row]", el).forEach(
            (c) =>
              (c.onchange = () => {
                const i = Number(c.dataset.row);
                c.checked ? S.cat.selected.add(i) : S.cat.selected.delete(i);
              }),
          );
          const allBox = $("#cat-all", el);
          if (allBox)
            allBox.onchange = () =>
              $$("[data-row]", el).forEach((c) => {
                c.checked = allBox.checked;
                c.onchange();
              });
        }

        function openRecord(rec, cat) {
          if (!rec) return;
          $("#drawer-title").textContent = recTitle(rec);
          const miss = missingOf(rec, cat);
          const rowsHtml = Object.keys(rec)
            .map((k) => `<tr><th>${esc(k)}</th><td>${esc(txt(rec[k]))}</td></tr>`)
            .join("");
          $("#drawer-body").innerHTML = `
            <p class="small muted">${esc(CATALOGUES[cat])} record &middot; every field the API returns.</p>
            <div class="chips" style="margin:10px 0 14px">${
              miss.length
                ? miss.map((m) => `<span class="chip miss">no ${esc(m)}</span>`).join("")
                : `<span class="chip ok">complete</span>`
            }</div>
            <div class="table-wrap"><table class="kv" style="min-width:0"><tbody>${rowsHtml}</tbody></table></div>
            <p class="notice" style="margin-top:14px">Editing a record from here arrives with phase 1 — today's API is read-only for the catalogue.</p>`;
          openOverlay($("#drawer-scrim"));
        }

        /* ───────────── needs input ───────────── */
        const QUEUE_STATUSES = ["needs_review", "needs_input"];
        const NO_REASON = "No reason recorded by the gate yet";
        function queueItems() {
          const d = val("staged", {});
          const list = (d && d.candidates) || [];
          const acted = new Set(S.queue.acted.map((a) => a.item.source_url));
          const live = list.filter(
            (c) => QUEUE_STATUSES.indexOf(c.status) >= 0 && !acted.has(c.source_url),
          );
          const restored = S.queue.acted
            .filter((a) => S.queue.restored.has(a.item.source_url))
            .map((a) => Object.assign({}, a.item, { _restored: a.kind }));
          return live.concat(restored);
        }
        function groupQueue(items) {
          const groups = new Map();
          items.forEach((c) => {
            const key = clean(c.reason).trim() || NO_REASON;
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(c);
          });
          return Array.from(groups.entries()).sort((a, b) => b[1].length - a[1].length);
        }
        function renderNeedsInput() {
          const el = $("#view-needs-input");
          if (!ok("staged")) {
            el.innerHTML = failed("staged", "the review queue");
            return;
          }
          const head = `
            <div class="toolbar">
              <label class="field">Show<select id="q-view">
                <option value="queue"${S.queue.view === "queue" ? " selected" : ""}>Queue (waiting on a decision)</option>
                <option value="history"${S.queue.view === "history" ? " selected" : ""}>History (decided)</option>
              </select></label>
              <p class="small muted keys-hint" style="flex:1 1 240px">Keys: <b>j</b> / <b>k</b> move between cards, <b>a</b> resubmits, <b>r</b> rejects. Both ask first.</p>
            </div>`;
          if (S.queue.view === "history") {
            el.innerHTML =
              head +
              `<p class="notice">Decisions taken earlier are not served by <code>/admin/api/social/staged</code> — it only returns candidates still waiting. A full history feed arrives with phase 1.</p>` +
              (S.queue.acted.length
                ? `<div class="section"><h2>Decided in this session</h2><div class="table-wrap"><table>
                     <thead><tr><th>When (UTC)</th><th>Decision</th><th>Author</th><th>Post</th></tr></thead>
                     <tbody>${S.queue.acted
                       .slice()
                       .reverse()
                       .map(
                         (a) =>
                           `<tr><td>${esc(stamp(a.at))}</td><td><span class="chip ${
                             a.kind === "rejected" ? "bad" : "ok"
                           }">${esc(a.kind)}</span></td><td>${esc(txt(a.item.author))}</td><td><a href="${esc(
                             a.item.source_url,
                           )}" target="_blank" rel="noopener">open</a></td></tr>`,
                       )
                       .join("")}</tbody></table></div></div>`
                : `<p class="notice" style="margin-top:12px">You have not decided anything in this session yet.</p>`);
            $("#q-view").onchange = (e) => {
              S.queue.view = e.target.value;
              renderNeedsInput();
            };
            return;
          }

          const items = queueItems();
          const groups = groupQueue(items);
          // Keep a group open across re-renders: a decision must not collapse
          // the group the curator is working through.
          if (!S.queue.open) S.queue.open = new Set(groups.length ? [groups[0][0]] : []);
          el.innerHTML =
            head +
            `<h2>From social</h2>` +
            (items.length === 0
              ? `<p class="notice">The queue is clear — every collected candidate has a decision. New posts land here after the next social collection.</p>`
              : `<p class="small muted" style="margin-bottom:12px">${items.length} candidate${
                  items.length === 1 ? "" : "s"
                } in ${groups.length} group${groups.length === 1 ? "" : "s"}.</p>` +
                groups
                  .map(([reason, list], gi) => {
                    const size = S.queue.size;
                    const page = S.queue.groupPage[reason] || 1;
                    const lastPage = pageCount(list.length, size);
                    const p = Math.min(page, lastPage);
                    const slice = list.slice((p - 1) * size, (p - 1) * size + size);
                    return `<details class="group" data-gi="${gi}" ${
                      S.queue.open.has(reason) ? "open" : ""
                    }>
                        <summary>
                          <span class="gt">${esc(reason)}</span>
                          <span class="badge">${list.length}</span>
                        </summary>
                        <div class="group-body">
                          <button class="btn small danger" data-reject-all="${gi}">Reject all ${
                            list.length
                          } in this group</button>
                          ${pager("queue-" + gi, p, list.length, size)}
                          ${slice.map((c) => queueCard(c)).join("")}
                        </div>
                      </details>`;
                  })
                  .join("")) +
            `<h2 style="margin-top:28px">From the catalogue</h2>` +
            renderCatalogueQueue();

          $("#q-view").onchange = (e) => {
            S.queue.view = e.target.value;
            renderNeedsInput();
          };
          wireCatalogueQueue(el);
          $$("[data-reject-all]", el).forEach(
            (b) => (b.onclick = () => rejectGroup((groups[Number(b.dataset.rejectAll)] || [""])[0])),
          );
          $$("[data-pager^='queue-']", el).forEach((p) => {
            const gi = Number(p.dataset.pager.slice(6));
            const reason = (groups[gi] || [""])[0];
            const list = (groups[gi] || [null, []])[1];
            p.querySelectorAll("[data-step]").forEach(
              (b) =>
                (b.onclick = () => {
                  const cur = S.queue.groupPage[reason] || 1;
                  S.queue.groupPage[reason] = Math.min(
                    Math.max(1, cur + Number(b.dataset.step)),
                    pageCount(list.length, S.queue.size),
                  );
                  renderNeedsInput();
                }),
            );
            const sizeSel = p.querySelector("[data-size]");
            if (sizeSel)
              sizeSel.onchange = () => {
                S.queue.size = Number(sizeSel.value);
                S.queue.groupPage = {};
                renderNeedsInput();
              };
          });
          $$("details.group", el).forEach((d) => {
            const reason = (groups[Number(d.dataset.gi)] || [""])[0];
            d.ontoggle = () => (d.open ? S.queue.open.add(reason) : S.queue.open.delete(reason));
          });
          $$(".qcard[data-url]", el).forEach((card) => {
            const url = card.dataset.url;
            $("[data-act='approve']", card).onclick = () => approveCandidate(url, card);
            $("[data-act='reject']", card).onclick = () => rejectCandidate(url, card);
          });
        }
        function queueCard(c) {
          const chips = [
            c.platform ? `<span class="chip">${esc(c.platform)}</span>` : "",
            c.found_via ? `<span class="chip">found via ${esc(c.found_via)}</span>` : "",
            c._restored ? `<span class="chip bad">${esc(c._restored)} just now</span>` : "",
          ].join("");
          const caption = clean(c.caption).trim();
          return `<article class="qcard" tabindex="0" data-url="${esc(c.source_url)}" aria-label="Candidate by ${esc(
            txt(c.author),
          )}">
            <div class="chips">${chips}</div>
            <p class="cap">${caption ? esc(caption) : '<span class="muted">No caption was captured for this post.</span>'}</p>
            <p class="small muted">${esc(txt(c.author))} &middot; captured ${esc(
              stamp(c.captured_at),
            )} &middot; <a href="${esc(c.source_url)}" target="_blank" rel="noopener">open the post</a></p>
            ${c.reason ? `<p class="why">${esc(c.reason)}</p>` : ""}
            ${c.missing_field ? `<p class="small"><b>Missing field:</b> ${esc(txt(c.missing_field))}</p>` : ""}
            ${
              c._restored
                ? `<p class="small muted">Undo only brought this card back on screen — the server still has it as ${esc(
                    c._restored,
                  )}. An un-reject endpoint arrives with phase 1.</p>`
                : ""
            }
            <div class="hint-row">
              <input type="text" data-hint placeholder="Add what the gate is missing — a date, or the real venue name" value="${esc(
                txt(c.hint) === DASH ? "" : c.hint,
              )}" aria-label="Hint for this candidate" />
            </div>
            <div class="acts">
              <button class="btn primary" data-act="approve">Resubmit</button>
              <button class="btn danger" data-act="reject">Reject</button>
            </div>
            <p class="qerr" data-err hidden></p>
          </article>`;
        }
        function candidateByUrl(url) {
          return (val("staged", {}).candidates || []).find((c) => c.source_url === url) || { source_url: url };
        }
        function recordDecision(url, kind) {
          S.queue.acted.push({ item: candidateByUrl(url), kind, at: new Date().toISOString() });
          S.queue.restored.delete(url);
        }
        async function approveCandidate(url, card) {
          const hint = ($("[data-hint]", card) || {}).value || "";
          const go = await askConfirm(
            "Resubmit this candidate?",
            "It runs through the publishing gate again. If it clears, it goes live on the public site.",
            "Resubmit",
          );
          if (!go) return;
          const err = $("[data-err]", card);
          err.hidden = true;
          try {
            await Api.approve(url, hint.trim());
            recordDecision(url, "approved");
            toast("Published. It is on the public site now.");
            renderNeedsInput();
            refreshBadges();
          } catch (e) {
            err.hidden = false;
            err.textContent =
              e.status === 422
                ? "Still not enough to publish: " + txt(e.message)
                : "Could not resubmit: " + txt(e.message);
          }
        }
        async function rejectCandidate(url, card) {
          const go = await askConfirm(
            "Reject this candidate?",
            "It leaves the queue and is kept as a rejected record. Nothing is deleted.",
            "Reject",
          );
          if (!go) return;
          const err = card ? $("[data-err]", card) : null;
          if (err) err.hidden = true;
          try {
            await Api.reject(url, "");
            recordDecision(url, "rejected");
            renderNeedsInput();
            refreshBadges();
            toast("Rejected.", "Undo", () => {
              S.queue.restored.add(url);
              renderNeedsInput();
            });
          } catch (e) {
            if (err) {
              err.hidden = false;
              err.textContent = "Could not reject: " + txt(e.message);
            } else toast("Could not reject: " + txt(e.message));
          }
        }
        async function rejectGroup(reason) {
          const list = groupQueue(queueItems()).find((g) => g[0] === reason);
          if (!list) return;
          const items = list[1];
          const go = await askConfirm(
            "Reject every candidate in this group?",
            `${items.length} candidate${items.length === 1 ? "" : "s"} will be rejected one by one. Nothing is deleted.`,
            "Reject all",
          );
          if (!go) return;
          let done = 0;
          for (const c of items) {
            try {
              await Api.reject(c.source_url, "");
              recordDecision(c.source_url, "rejected");
              done++;
            } catch (e) {
              /* keep going; the tally reports what landed */
            }
          }
          renderNeedsInput();
          refreshBadges();
          toast(`Rejected ${done} of ${items.length}.`);
        }

        /* ───────────── needs input: catalogue records ─────────────
         * A different file and shape from the social queue above: these are
         * already events/places/holidays, one field away from on-air. The
         * curator edits exactly the field `missing_field` names, never a
         * free-text hint — the server maps it back onto the record. */
        const PATCH_FORM = {
          title: { label: "Title", multi: false },
          summary: { label: "One-line summary", multi: false },
          description: { label: "Description (a few sentences, real prose)", multi: false, area: true },
          county: { label: "County", multi: false },
          address: { label: "Address", multi: false },
          country: { label: "Country (ISO code, e.g. IE)", multi: false },
          start_date: { label: "Start date (YYYY-MM-DD)", multi: false },
          date_evidence: { label: "Quote from the source naming the date", multi: false },
          price_band: { label: "Price band (free / under-10 / 10-25 / 25-plus)", multi: false },
          age_bands: { label: "Age bands (comma-separated, e.g. 3-5, 6-9)", multi: true },
          activity_types: { label: "Activity types (comma-separated)", multi: true },
          holiday_types: { label: "Holiday types (comma-separated)", multi: true },
          best_seasons: { label: "Seasons (comma-separated)", multi: true },
          facts: { label: "What you know is true (quote it if you can)", multi: false },
          sources: { label: "A second source URL", multi: false },
        };
        function catalogueQueueItems() {
          const d = val("catalogueNeedsInput", {});
          return (d && d.records) || [];
        }
        function catalogueQueueCard(r) {
          const field = PATCH_FORM[r.missing_field] || { label: r.missing_field || "the missing field" };
          const where = [r.location && r.location.county, r.kind].filter(Boolean).join(" · ");
          return `<article class="qcard" tabindex="0" data-id="${esc(r.id)}" aria-label="${esc(r.title)}">
            <div class="chips"><span class="chip">${esc(r.kind)}</span>${
              where ? `<span class="chip">${esc(where)}</span>` : ""
            }</div>
            <p class="cap"><b>${esc(r.title || "(no title yet)")}</b></p>
            ${r.reason ? `<p class="why">${esc(r.reason)}</p>` : ""}
            <div class="hint-row">
              <label class="small muted" for="patch-${esc(r.id)}">${esc(field.label)}</label>
              ${
                field.area
                  ? `<textarea id="patch-${esc(r.id)}" data-patch rows="3" placeholder="${esc(field.label)}"></textarea>`
                  : `<input type="text" id="patch-${esc(r.id)}" data-patch placeholder="${esc(field.label)}" />`
              }
            </div>
            <div class="acts">
              <button class="btn primary" data-cat-act="resubmit">Resubmit</button>
              <button class="btn danger" data-cat-act="reject">Reject</button>
            </div>
            <p class="qerr" data-err hidden></p>
          </article>`;
        }
        function renderCatalogueQueue() {
          if (!ok("catalogueNeedsInput"))
            return failed("catalogueNeedsInput", "the catalogue needs-input queue");
          const items = catalogueQueueItems();
          if (!items.length)
            return `<p class="notice">Nothing in the catalogue is waiting on a curator right now.</p>`;
          const size = S.catQueue.size;
          const lastPage = pageCount(items.length, size);
          const p = Math.min(S.catQueue.page, lastPage);
          const slice = items.slice((p - 1) * size, (p - 1) * size + size);
          return (
            `<p class="small muted" style="margin-bottom:12px">${items.length} record${
              items.length === 1 ? "" : "s"
            } the gate could not publish yet.</p>` +
            pager("catq", p, items.length, size) +
            slice.map(catalogueQueueCard).join("")
          );
        }
        async function resubmitCatalogueRecord(id, card) {
          const field = $("[data-patch]", card);
          const value = (field && field.value) || "";
          if (!value.trim()) {
            const err = $("[data-err]", card);
            err.hidden = false;
            err.textContent = "Type a value before resubmitting.";
            return;
          }
          const record = catalogueQueueItems().find((r) => r.id === id) || {};
          const go = await askConfirm(
            "Resubmit this record?",
            "It runs through the publishing gate again with your correction. If it clears, it goes live on the public site.",
            "Resubmit",
          );
          if (!go) return;
          const err = $("[data-err]", card);
          err.hidden = true;
          try {
            const patch = {};
            patch[record.missing_field] = value.trim();
            const result = await Api.resubmitCatalogueRecord(id, patch);
            toast(result.status === "on-air" ? "Published. It is on the public site now." : "Updated.");
            store.catalogueNeedsInput = { ok: true, data: await Api.catalogueNeedsInput() };
            renderNeedsInput();
            refreshBadges();
          } catch (e) {
            err.hidden = false;
            err.textContent =
              e.status === 422
                ? "Still not enough to publish: " + txt(e.message)
                : "Could not resubmit: " + txt(e.message);
          }
        }
        async function rejectCatalogueRecord(id, card) {
          const go = await askConfirm(
            "Reject this record?",
            "It leaves the queue and is kept as a rejected record. Nothing is deleted.",
            "Reject",
          );
          if (!go) return;
          try {
            await Api.rejectCatalogueRecord(id);
            toast("Rejected.");
            store.catalogueNeedsInput = { ok: true, data: await Api.catalogueNeedsInput() };
            renderNeedsInput();
            refreshBadges();
          } catch (e) {
            const err = $("[data-err]", card);
            if (err) {
              err.hidden = false;
              err.textContent = "Could not reject: " + txt(e.message);
            }
          }
        }
        function wireCatalogueQueue(el) {
          $$(".qcard[data-id]", el).forEach((card) => {
            const id = card.dataset.id;
            $$("[data-cat-act]", card).forEach((b) => {
              b.onclick = () =>
                b.dataset.catAct === "resubmit"
                  ? resubmitCatalogueRecord(id, card)
                  : rejectCatalogueRecord(id, card);
            });
          });
          const p = $("[data-pager='catq']", el);
          if (p) {
            p.querySelectorAll("[data-step]").forEach(
              (b) =>
                (b.onclick = () => {
                  const lastPage = pageCount(catalogueQueueItems().length, S.catQueue.size);
                  S.catQueue.page = Math.min(Math.max(1, S.catQueue.page + Number(b.dataset.step)), lastPage);
                  renderNeedsInput();
                }),
            );
            const sizeSel = p.querySelector("[data-size]");
            if (sizeSel)
              sizeSel.onchange = () => {
                S.catQueue.size = Number(sizeSel.value);
                S.catQueue.page = 1;
                renderNeedsInput();
              };
          }
        }

        /* ───────────── sources ───────────── */
        function renderSources() {
          const el = $("#view-sources");
          if (!ok("sources")) {
            el.innerHTML = failed("sources", "the source list");
            return;
          }
          const sources = val("sources", []);
          const byType = (val("stats", {}) || {}).sources_by_type || {};
          const st = val("status", {});
          const pl = val("pipeline", {});
          const running = !!st.factory_running;
          const stages = ["url_discovery", "crawling", "extraction", "deduplication", "output"];
          el.innerHTML = `
            <div class="card">
              <div class="toolbar" style="margin:0">
                <button class="btn primary" id="run-now"${running ? " disabled" : ""}>${
                  running ? "A run is in flight" : "Run collection now"
                }</button>
                <button class="btn small" disabled title="No create-source endpoint exists yet">Add source (phase 3)</button>
                <span class="small muted" style="flex:1 1 200px">Pipeline stages right now: ${stages
                  .map((s) => `${s.replace(/_/g, " ")} <b>${esc(txt(pl[s]))}</b>`)
                  .join(" &middot; ")}</span>
              </div>
            </div>
            <div class="section">
              <h2>Sources</h2>
              <p class="sub">${sources.length} configured. The count column is events currently on air from that lane (<code>/admin/api/stats</code>); a per-cycle found/rejected split is not in the API yet.</p>
              ${
                sources.length === 0
                  ? `<p class="notice">No sources are configured yet.</p>`
                  : `<div class="table-wrap"><table>
                      <thead><tr><th>City</th><th>Lane</th><th>URL</th><th>On air now</th></tr></thead>
                      <tbody>${sources
                        .map(
                          (s) => `<tr>
                            <td>${esc(txt(s.city))}</td>
                            <td>${esc(txt(s.name || s.type))}</td>
                            <td><a href="${esc(s.url || "#")}" target="_blank" rel="noopener">${esc(
                              txt(s.url),
                            )}</a></td>
                            <td>${
                              byType[s.name || s.type] != null
                                ? esc(String(byType[s.name || s.type]))
                                : '<span class="muted">no run data yet</span>'
                            }</td>
                          </tr>`,
                        )
                        .join("")}</tbody></table></div>`
              }
            </div>`;
          const run = $("#run-now");
          if (run && !running)
            run.onclick = async () => {
              const go = await askConfirm(
                "Start a collection run?",
                "The factory crawls every configured source. It can take several minutes and it writes to the live catalogue.",
                "Run now",
              );
              if (!go) return;
              run.disabled = true;
              try {
                const r = await Api.runPipeline();
                toast(r && r.status === "already_running" ? "A run is already going." : "Collection run started.");
                store.status = { ok: true, data: await Api.status() };
                renderSources();
              } catch (e) {
                run.disabled = false;
                toast("Could not start a run: " + txt(e.message));
              }
            };
        }

        /* ───────────── production ───────────── */
        function renderProduction() {
          const el = $("#view-production");
          const pl = val("pipeline", {});
          const history = ((pl && pl.history) || []).slice().reverse();
          const lines = val("logs", []);
          const lanes = Api.llmLanes(val("status", {}), pl);
          const q = S.log.q.toLowerCase();
          const shown = q ? lines.filter((l) => String(l).toLowerCase().includes(q)) : lines;
          const isErr = (l) => /error|fail|timeout|traceback|exception|no such file/i.test(String(l));
          el.innerHTML = `
            <div class="section" style="margin-top:0">
              <h2>Runs</h2>
              <p class="sub">Newest first, from <code>/admin/api/pipeline</code>.</p>
              ${
                !ok("pipeline")
                  ? failed("pipeline", "the run history")
                  : history.length === 0
                    ? `<p class="notice">No collection run has been recorded yet. Start one from Sources.</p>`
                    : `<div class="table-wrap"><table>
                        <thead><tr><th>Started</th><th>Result</th><th>Events</th><th>Sources</th><th>Duration</th><th>Error</th></tr></thead>
                        <tbody>${history
                          .map(
                            (r) => `<tr>
                              <td>${esc(stamp(r.time))}</td>
                              <td><span class="chip ${r.success ? "ok" : "bad"}">${
                                r.success ? "succeeded" : "failed"
                              }</span></td>
                              <td>${esc(txt(r.events_count))}</td>
                              <td>${esc(txt(r.sources_count))}</td>
                              <td>${esc(txt(r.duration))}</td>
                              <td>${
                                r.error
                                  ? esc(txt(r.error))
                                  : r.success
                                    ? DASH
                                    : `<a href="#" data-jump-log>no error text recorded — open the run log</a>`
                              }</td>
                            </tr>`,
                          )
                          .join("")}</tbody></table></div>`
              }
            </div>
            <div class="section">
              <h2>LLM lanes</h2>
              ${
                lanes
                  ? `<div class="table-wrap"><table class="kv"><tbody>${Object.keys(lanes)
                      .map((k) => `<tr><th>${esc(k)}</th><td>${esc(txt(lanes[k]))}</td></tr>`)
                      .join("")}</tbody></table></div>`
