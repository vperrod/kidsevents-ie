                  : `<p class="notice">No routing data yet — neither <code>/admin/api/status</code> nor <code>/admin/api/pipeline</code> exposes <code>factory_state.json.llm</code>. Phase 2 adds it.</p>`
              }
            </div>
            <div class="section" id="log-section">
              <h2>Run log</h2>
              <p class="sub">Last ${lines.length} line${
                lines.length === 1 ? "" : "s"
              } of <code>pipeline.log</code>. Error lines are highlighted.</p>
              <div class="toolbar">
                <label class="field grow">Search the log<input type="search" id="log-q" value="${esc(
                  S.log.q,
                )}" placeholder="source name, error text…" /></label>
                <span class="small muted">${shown.length} line${shown.length === 1 ? "" : "s"} shown</span>
              </div>
              ${
                !ok("logs")
                  ? failed("logs", "the run log")
                  : shown.length === 0
                    ? `<p class="notice">No log line matches “${esc(S.log.q)}”.</p>`
                    : `<div class="log">${shown
                        .map((l) => `<span class="ln${isErr(l) ? " err" : ""}">${esc(l) || "&nbsp;"}</span>`)
                        .join("")}</div>`
              }
            </div>`;
          const lq = $("#log-q");
          if (lq)
            lq.oninput = () => {
              S.log.q = lq.value;
              const pos = lq.selectionStart;
              renderProduction();
              const nb = $("#log-q");
              nb.focus();
              nb.setSelectionRange(pos, pos);
            };
          $$("[data-jump-log]", el).forEach(
            (a) =>
              (a.onclick = (e) => {
                e.preventDefault();
                $("#log-section").scrollIntoView({ behavior: "smooth", block: "start" });
              }),
          );
        }

        /* ───────────── photos ───────────── */
        function renderPhotos() {
          const el = $("#view-photos");
          const cats = Object.keys(CATALOGUES).filter((c) => ok(catKey(c)));
          if (!cats.length) {
            el.innerHTML = failed("events", "the catalogues");
            return;
          }
          const without = [];
          const cards = cats
            .map((c) => {
              const recs = catRecords(c);
              const withPhoto = recs.filter(hasPhoto);
              recs.filter((r) => !hasPhoto(r)).forEach((r) => without.push({ cat: c, rec: r }));
              return `<div class="card stat">
                  <span class="k">${esc(CATALOGUES[c])}</span>
                  <b>${withPhoto.length}/${recs.length}</b>
                  <span class="n">${pct(withPhoto.length, recs.length)}% have an image field</span>
                  <div class="bar"><i style="width:${pct(withPhoto.length, recs.length)}%"></i></div>
                </div>`;
            })
            .join("");
          const total = without.length;
          const first = without.slice(0, 50);
          el.innerHTML = `
            <div class="grid">${cards}</div>
            <p class="notice" style="margin-top:14px">Coverage is computed here from the records themselves (any of ${PHOTO_KEYS.join(
              ", ",
            )}). Today's data contract carries no image field at all, so nothing is counted as covered.</p>
            <div class="section">
              <div class="toolbar">
                <h2 style="flex:1 1 200px">Records with no image ${
                  total > 50 ? `<span class="small muted">(first 50 of ${total})</span>` : ""
                }</h2>
                <button class="btn small" disabled title="No upload endpoint exists yet">Upload a photo (phase 4)</button>
              </div>
              ${
                total === 0
                  ? `<p class="notice">Every record has an image. Nothing to chase.</p>`
                  : `<div class="table-wrap"><table>
                      <thead><tr><th>Catalogue</th><th>Title</th><th>County</th><th>Source</th></tr></thead>
                      <tbody>${first
                        .map(
                          (x) => `<tr>
                            <td>${esc(CATALOGUES[x.cat])}</td>
                            <td>${esc(recTitle(x.rec))}</td>
                            <td>${esc(recCounty(x.rec) || DASH)}</td>
                            <td>${
                              x.rec.url || x.rec.source_url
                                ? `<a href="${esc(
                                    x.rec.url || x.rec.source_url,
                                  )}" target="_blank" rel="noopener">open</a>`
                                : DASH
                            }</td>
                          </tr>`,
                        )
                        .join("")}</tbody></table></div>`
              }
            </div>`;
        }

        /* ───────────── metrics ───────────── */
        function renderMetrics() {
          const el = $("#view-metrics");
          const m = val("metrics", {});
          const totals = (m && m.totals) || {};
          const events = val("events", []);
          const rows = FIELDS.events.map(([name, test]) => {
            const n = events.filter(test).length;
            return { name, n, p: pct(n, events.length) };
          });
          el.innerHTML = `
            <div class="grid">
              <div class="card">
                <h3>Visitors</h3>
                <p class="notice" style="margin-top:8px">Not connected yet (phase D).</p>
              </div>
              <div class="card">
                <h3>Search</h3>
                <p class="notice" style="margin-top:8px">Not connected yet (phase D).</p>
              </div>
              <div class="card">
                <h3>Content</h3>
                ${
                  ok("metrics")
                    ? `<p class="small muted" style="margin-top:8px">On air right now</p>
                       <p><b>${num(totals.events)}</b> events &middot; <b>${num(
                         totals.places,
                       )}</b> things to do &middot; <b>${num(totals.holidays)}</b> holidays</p>
                       <p class="small muted" style="margin-top:8px">${num(
                         totals.needs_review,
                       )} waiting in Needs input</p>`
                    : failed("metrics", "the content numbers")
                }
              </div>
            </div>
            <div class="section">
              <h2>Event completeness</h2>
              <p class="sub">Computed here from <code>/admin/api/events</code> over ${
                events.length
              } event${events.length === 1 ? "" : "s"}.</p>
              ${
                events.length === 0
                  ? `<p class="notice">No events to measure yet.</p>`
                  : `<div class="table-wrap"><table>
                      <thead><tr><th>Field</th><th>Filled</th><th>Share</th></tr></thead>
                      <tbody>${rows
                        .map(
                          (r) => `<tr><td>${esc(r.name)}</td><td>${r.n} of ${events.length}</td>
                            <td><b>${r.p}%</b><div class="bar"><i style="width:${r.p}%"></i></div></td></tr>`,
                        )
                        .join("")}</tbody></table></div>`
              }
            </div>`;
        }

        /* ───────────── settings ───────────── */
        function renderSettings() {
          const el = $("#view-settings");
          const st = val("status", {});
          const sources = val("sources", []);
          const row = (k, v) => `<tr><th>${esc(k)}</th><td>${v}</td></tr>`;
          const unknown = '<span class="muted">Not exposed by the API yet</span>';
          el.innerHTML = `
            ${ok("status") ? "" : failed("status", "the system status")}
            <div class="table-wrap"><table class="kv"><tbody>
              ${row("Factory service active", esc(txt(st.factory_service_active)))}
              ${row("Factory timer unit", esc(txt(st.factory_timer)))}
              ${row("Timer cadence", unknown)}
              ${row("A run is in flight", esc(txt(st.factory_running)))}
              ${row("Last run", esc(stamp(st.last_run)))}
              ${row("Last run result", st.last_run_result ? esc(txt(st.last_run_result)) : unknown)}
              ${row("Auto-approve", unknown)}
              ${row("Quality thresholds", unknown)}
              ${row("Sources configured", esc(String(sources.length)))}
            </tbody></table></div>
            <p class="notice" style="margin-top:14px">This page is read-only. Editing these — auto-approve, thresholds, the facet and tag lists — arrives with phase 1's facet file.</p>
            <div class="section" id="claims-section"></div>`;
          renderClaims();
        }

        /* ───────────── organiser claims (inbound half of §4.6) ───────────── */
        const RELATIONSHIP = { owner: "Owns it", manager: "Manages or works there", other: "Other" };
        function renderClaims() {
          const el = $("#claims-section");
          if (!el) return;
          if (!ok("claims")) {
            el.innerHTML = `<h2>Organiser claims</h2>${failed("claims", "the organiser claims")}`;
            return;
          }
          const all = val("claims", []);
          const size = S.claims.size;
          S.claims.page = Math.min(S.claims.page, pageCount(all.length, size));
          const page = all.slice((S.claims.page - 1) * size, S.claims.page * size);
          el.innerHTML = `
            <h2>Organiser claims</h2>
            <p class="sub">Venues telling us about their own listing, newest first. Nothing is emailed out yet — reply from your own mailbox until <code>hello@smalldays.ie</code> exists.</p>
            ${
              all.length
                ? `<div class="table-wrap"><table><thead><tr>
                     <th>Received</th><th>Listing</th><th>From</th><th>Relationship</th><th>Photos</th><th>What needs to change</th>
                   </tr></thead><tbody>
                   ${page
                     .map(
                       (c) => `<tr>
                         <td>${esc(stamp(c.received_at))}</td>
                         <td>${esc(txt(c.record_title))}${
                           c.source_url
                             ? `<br><a href="${esc(c.source_url)}" target="_blank" rel="noopener noreferrer" class="small">source</a>`
                             : ""
                         }</td>
                         <td>${esc(txt(c.name))}<br><a href="mailto:${esc(c.email)}" class="small">${esc(txt(c.email))}</a></td>
                         <td>${esc(RELATIONSHIP[c.relationship] || txt(c.relationship))}</td>
                         <td>${c.has_photos ? "Offered" : DASH}</td>
                         <td>${esc(txt(c.message))}</td>
                       </tr>`,
                     )
                     .join("")}
                   </tbody></table></div>
                   ${pager("claims", S.claims.page, all.length, size)}`
                : `<p class="notice">No organiser has written in yet. The form is live on every listing.</p>`
            }`;
          wirePager(el, "claims", S.claims, all.length, renderClaims);
        }

        /* ───────────── pager wiring (shared) ───────────── */
        function wirePager(root, id, state, total, rerender) {
          $$(`[data-pager="${id}"]`, root).forEach((p) => {
            p.querySelectorAll("[data-step]").forEach(
              (b) =>
                (b.onclick = () => {
                  state.page = Math.min(
                    Math.max(1, state.page + Number(b.dataset.step)),
                    pageCount(total, state.size),
                  );
                  rerender();
                  scrollTo({ top: 0, behavior: "smooth" });
                }),
            );
            const sel = p.querySelector("[data-size]");
            if (sel)
              sel.onchange = () => {
                state.size = Number(sel.value);
                state.page = 1;
                rerender();
              };
          });
        }

        /* ───────────── badges + chrome ───────────── */
        function refreshBadges() {
          const socialPending = ok("staged") ? queueItems().length : 0;
          const catPending = ok("catalogueNeedsInput") ? catalogueQueueItems().length : 0;
          const pending = ok("staged") || ok("catalogueNeedsInput") ? socialPending + catPending : null;
          const fails = ((val("pipeline", {}) || {}).history || []).filter((r) => !r.success).length;
          const set = (k, n, bad) =>
            $$(`[data-badge="${k}"]`).forEach((b) => {
              if (!n) {
                b.hidden = true;
                return;
              }
              b.hidden = false;
              b.textContent = String(n);
              b.classList.toggle("bad", !!bad);
            });
          set("needs-input", pending);
          set("production", fails, true);
          $("#rail-stamp").textContent = ok("metrics")
            ? "Counted " + stamp(val("metrics", {}).generated_at)
            : "Counts unavailable";
        }
        function markNav() {
          $$("[data-area]").forEach((a) => {
            const active = a.dataset.area === S.area;
            if (active) a.setAttribute("aria-current", "page");
            else a.removeAttribute("aria-current");
            if (a.dataset.area === "catalogue") a.setAttribute("href", href("catalogue", S.catalogue));
          });
        }

        const RENDER = {
          overview: renderOverview,
          catalogue: renderCatalogue,
          "needs-input": renderNeedsInput,
          sources: renderSources,
          production: renderProduction,
          photos: renderPhotos,
          metrics: renderMetrics,
          settings: renderSettings,
        };
        function route() {
          const { area, param } = parseHash();
          S.area = area;
          if (area === "catalogue" && CATALOGUES[param] && param !== S.catalogue) {
            S.catalogue = param;
            S.cat.page = 1;
            S.cat.selected = new Set();
          }
          const meta = AREAS[area];
          $("#page-title").textContent = meta.title;
          $("#page-sub").textContent = meta.sub;
          $("#topbar-where").textContent = meta.label;
          document.title = "Small Days — " + meta.title;
          $$(".view").forEach((v) => v.classList.toggle("active", v.id === "view-" + area));
          markNav();
          try {
            RENDER[area]();
          } catch (e) {
            $("#view-" + area).innerHTML = `<p class="notice error">This area failed to render: ${esc(
              String((e && e.message) || e),
            )}</p>`;
          }
          refreshBadges();
        }

        /* ───────────── keyboard on the queue ───────────── */
        addEventListener("keydown", (e) => {
          if (S.area !== "needs-input" || closer || confirmResolve) return;
          if (e.metaKey || e.ctrlKey || e.altKey) return;
          const tag = (e.target.tagName || "").toLowerCase();
          if (tag === "input" || tag === "textarea" || tag === "select") return;
          const cards = $$("#view-needs-input .qcard");
          if (!cards.length) return;
          const key = e.key.toLowerCase();
          if (key === "j" || key === "k") {
            e.preventDefault();
            const cur = cards.indexOf(document.activeElement.closest(".qcard"));
            const next = key === "j" ? Math.min(cur + 1, cards.length - 1) : Math.max(cur - 1, 0);
            const target = cards[cur < 0 ? 0 : next];
            target.focus();
            target.scrollIntoView({ block: "center" });
          } else if (key === "a" || key === "r") {
            const card = document.activeElement.closest(".qcard") || cards[0];
            if (!card) return;
            e.preventDefault();
            card.focus();
            if (card.dataset.id) {
              key === "a" ? resubmitCatalogueRecord(card.dataset.id, card) : rejectCatalogueRecord(card.dataset.id, card);
            } else {
              key === "a" ? approveCandidate(card.dataset.url, card) : rejectCandidate(card.dataset.url, card);
            }
          }
        });

        /* ───────────── boot ───────────── */
        $("#rail-nav").innerHTML = navHtml();
        $("#sheet-nav").innerHTML = navHtml();
        $("#areas-btn").onclick = () => openOverlay($("#sheet-scrim"));
        $$("#sheet-nav [data-area]").forEach(
          (a) =>
            (a.onclick = (e) => {
              e.preventDefault();
              const target = a.getAttribute("href");
              closeOverlay();
              setTimeout(() => {
                location.hash = target;
              }, 0);
            }),
        );
        $("#refresh").onclick = async () => {
          $("#refresh").disabled = true;
          $("#refresh").textContent = "Refreshing…";
          await loadAll();
          $("#refresh").disabled = false;
          $("#refresh").textContent = "Refresh data";
          route();
          toast("Data refreshed.");
        };
        addEventListener("hashchange", route);

        $("#view-overview").innerHTML =
          '<div class="grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>';
        $$(".view").forEach((v) => v.classList.toggle("active", v.id === "view-" + parseHash().area));
        loadAll().then(route);
      })();
    </script>
  </body>
</html>
